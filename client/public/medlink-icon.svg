<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="medlink-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="medlink-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container / Squircle -->
  <rect width="480" height="480" x="16" y="16" rx="140" ry="140" fill="url(#medlink-bg)" />
  
  <!-- Subtle Inner Border / Glass Effect -->
  <rect width="476" height="476" x="18" y="18" rx="138" ry="138" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- The Medical Cross Base (Vertical and Horizontal Arms) -->
  <!-- Vertical Arm -->
  <rect x="216" y="112" width="80" height="288" rx="24" fill="url(#medlink-cross)" filter="url(#glow)" />
  <!-- Horizontal Arm Base -->
  <rect x="112" y="216" width="288" height="80" rx="24" fill="url(#medlink-cross)" filter="url(#glow)" />

  <!-- Dynamic AI EKG / Heartbeat Pulse Line intersecting the Cross -->
  <path d="M 90 256 L 170 256 L 205 170 L 256 340 L 305 200 L 340 256 L 422 256" 
        fill="none" stroke="url(#pulse-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Connection Nodes / Neural Dots -->
  <circle cx="205" cy="170" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="340" r="16" fill="#34d399" stroke="#ffffff" stroke-width="6" />
  <circle cx="305" cy="200" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
  <circle cx="90" cy="256" r="10" fill="#60a5fa" />
  <circle cx="422" cy="256" r="10" fill="#34d399" />
</svg>
